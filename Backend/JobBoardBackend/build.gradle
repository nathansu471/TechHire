plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Job Search API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Core Spring Boot Dependencies ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // --- Database ---
    implementation 'com.mysql:mysql-connector-j'

    // --- Search Integration (Hibernate Search with Lucene backend) ---
    implementation 'org.hibernate.search:hibernate-search-mapper-orm:7.1.2.Final'
    implementation 'org.hibernate.search:hibernate-search-backend-lucene:7.1.2.Final'

    // --- Lombok (Code Generation) ---
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Testing ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
